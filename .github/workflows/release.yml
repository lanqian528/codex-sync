name: Test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, artifact: windows-x64, binary: codex-sync.exe}
          - {os: ubuntu-22.04, artifact: linux-x64, binary: codex-sync}
          - {os: ubuntu-24.04-arm, artifact: linux-arm64, binary: codex-sync}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - run: python -m unittest discover -s tests -v
      - run: node --test
        working-directory: worker
      - run: python -m PyInstaller --clean --noconfirm --onefile --name codex-sync codex_sync.py
      - run: ./dist/${{ matrix.binary }} --help
      - run: python tests/probe_binary.py ./dist/${{ matrix.binary }}
      - name: Package
        shell: python
        run: |
          import shutil, pathlib, hashlib
          name = 'codex-sync-${{ matrix.artifact }}'
          p = pathlib.Path('package') / name
          p.mkdir(parents=True)
          shutil.copy('dist/${{ matrix.binary }}', p)
          for f in ['README.md', 'LICENSE']:
              shutil.copy(f, p)
          shutil.copytree('examples', p / 'examples')
          shutil.copytree('scripts', p / 'scripts')
          out = pathlib.Path('release'); out.mkdir()
          shutil.make_archive(str(out / name), 'zip', 'package')
          file = out / (name + '.zip')
          (out / (name + '.zip.sha256')).write_text(hashlib.sha256(file.read_bytes()).hexdigest() + '  ' + file.name + '\n')
      - uses: actions/upload-artifact@v4
        with:
          name: codex-sync-${{ matrix.artifact }}
          path: release/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --verify-tag --generate-notes
